services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # override host-facing values from .env with in-network service names
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudflax}:${POSTGRES_PASSWORD:-cloudflax}@db:5432/${POSTGRES_DB:-cloudflax_ecommerce}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudflax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudflax}
      POSTGRES_DB: ${POSTGRES_DB:-cloudflax_ecommerce}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudflax}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
