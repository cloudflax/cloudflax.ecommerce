name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: 'postgresql://user:pass@localhost:5432/db?schema=public'
  REDIS_URL: 'redis://localhost:6379'
  NEXTAUTH_SECRET: 'ci-placeholder-secret'
  NEXTAUTH_URL: 'http://localhost:3000'
  NEXT_PUBLIC_SENTRY_DSN: 'https://5aa618c36b3318731d931dd13d1415c5@o4511870380736513.ingest.us.sentry.io/4511870386896896'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # e2e (pnpm test:e2e) intentionally not run here yet: the only spec
      # checks that the home page loads. Wire it in once there are real
      # flow specs (login, checkout) worth the browser-install + run time.

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
